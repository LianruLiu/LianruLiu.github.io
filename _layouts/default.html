<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>

  <!-- Google Analytics (GA4) — private pageview tracking.
       Replace G-XXXXXXXXXX below with your own GA4 Measurement ID.
       Pageviews are NOT shown anywhere on the site; you check them
       privately by logging into https://analytics.google.com -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>

  <style>
    :root {
      --bg: #f4f4f2;
      --text: #111;
      --muted: #777;
      --border: #111;
      --card: #ffffff;
      --soft: #e6e6e6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Helvetica, Arial, sans-serif;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #050505;
      color: #fff;
      padding: 18px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-family: "Courier New", monospace;
      font-size: 1rem;
      letter-spacing: 0.08em;
      font-weight: bold;
    }

    .logo span {
      background: #fff;
      color: #000;
      padding: 2px 6px;
      margin-right: 6px;
    }

    .logo a {
      color: #fff;
      text-decoration: none;
    }

    .nav-menu a {
      color: #ccc;
      text-decoration: none;
      margin-left: 24px;
      font-family: "Courier New", monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .nav-menu a:hover {
      color: #fff;
    }

    .container {
      max-width: 860px;
      width: 100%;
      margin: 64px auto;
      padding: 0 24px;
      flex: 1;
    }

    .intro-box {
      border: 1px solid var(--border);
      background: var(--card);
      padding: 36px;
      margin-bottom: 34px;
      box-shadow: 8px 8px 0 #111;
    }

    .intro-box h2 {
      font-size: 1.2rem;
      letter-spacing: 0.04em;
      margin-bottom: 18px;
    }

    .intro-quote {
      font-family: "Courier New", monospace;
      font-size: 0.82rem;
      color: #444;
      border-left: 3px solid #111;
      padding-left: 16px;
      max-width: 620px;
    }

    .section-title {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin: 36px 0 18px;
      border-bottom: 1px solid #111;
      padding-bottom: 8px;
    }

    .search-wrapper {
      margin: 28px 0 32px;
    }

    .search-input {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #111;
      background: #fff;
      font-family: "Courier New", monospace;
      font-size: 0.9rem;
      outline: none;
    }

    .search-input:focus {
      box-shadow: 5px 5px 0 #111;
    }

    .post-card {
      background: var(--card);
      border: 1px solid #111;
      padding: 28px 30px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .post-card:hover {
      transform: translateY(-3px);
      box-shadow: 7px 7px 0 #111;
    }

    .post-meta {
      font-family: "Courier New", monospace;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .post-title {
      font-size: 1.55rem;
      line-height: 1.35;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .post-title a {
      color: #111;
      text-decoration: none;
    }

    .post-excerpt {
      color: #555;
      font-size: 0.95rem;
      max-width: 680px;
    }

    .article {
      max-width: 760px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid #111;
      padding: 56px;
      box-shadow: 10px 10px 0 #111;
    }

    .back-link {
      display: inline-block;
      background: #111;
      color: #fff;
      padding: 6px 14px;
      font-family: "Courier New", monospace;
      font-size: 0.75rem;
      text-decoration: none;
      margin-bottom: 36px;
    }

    .article h1 {
      font-size: 2.35rem;
      line-height: 1.25;
      font-weight: 900;
      margin-bottom: 18px;
      padding-bottom: 22px;
      border-bottom: 3px solid #111;
    }

    .article .post-meta {
      margin-bottom: 36px;
    }

    .article-content {
      font-family: Georgia, "Times New Roman", "Noto Serif SC", serif;
      font-size: 1.12rem;
      line-height: 2;
    }

    .article-content p {
      margin-bottom: 1.45em;
    }

    .article-content h1 {
      display: none;
    }

    .article-content h2 {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 1.35rem;
      margin: 2.2em 0 1em;
      border-bottom: 1px solid #111;
      padding-bottom: 8px;
    }

    .article-content h3 {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 1.1rem;
      margin: 2em 0 0.8em;
    }

    .article-content blockquote {
      border-left: 3px solid #111;
      padding-left: 18px;
      color: #444;
      margin: 2em 0;
      font-style: italic;
    }

    .article-content ul,
    .article-content ol {
      margin: 1.2em 0 1.8em 1.6em;
    }

    .article-content li {
      margin-bottom: 0.5em;
    }

    .article-content code {
      font-family: "Courier New", monospace;
      background: #eee;
      padding: 2px 5px;
      font-size: 0.9em;
    }

    .article-content pre {
      background: #111;
      color: #eee;
      padding: 20px;
      overflow-x: auto;
      margin: 2em 0;
    }

    .article-content pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }

    footer {
      background: #080808;
      color: #888;
      padding: 42px 20px;
      text-align: center;
      border-top: 1px solid #333;
      margin-top: 80px;
    }

    .footer-link {
      color: #fff;
      text-decoration: none;
      border-bottom: 1px dotted #777;
    }

    .copyright {
      font-family: "Courier New", monospace;
      font-size: 0.75rem;
      margin-top: 18px;
      opacity: 0.65;
    }

    #no-results {
      display: none;
      text-align: center;
      color: #666;
      padding: 30px;
      font-family: "Courier New", monospace;
    }

    @media (max-width: 700px) {
      header {
        padding: 16px 20px;
      }

      .nav-menu a {
        margin-left: 12px;
        font-size: 0.68rem;
      }

      .container {
        margin: 36px auto;
        padding: 0 16px;
      }

      .intro-box {
        padding: 26px;
        box-shadow: 5px 5px 0 #111;
      }

      .article {
        padding: 32px 24px;
        box-shadow: 6px 6px 0 #111;
      }

      .article h1 {
        font-size: 1.85rem;
      }

      .post-title {
        font-size: 1.28rem;
      }
    }
    /* ===== Heading Fix ===== */

.article-content h2 {
  display: block;
  font-size: 1.45rem;
  font-weight: 700;
  line-height: 1.45;
  color: #111 !important;

  margin-top: 2.6em;
  margin-bottom: 1em;

  padding-bottom: 0.45em;
  border-bottom: 1px solid #111;

  font-family:
    Helvetica,
    Arial,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

.article-content h3 {
  display:block;
  font-size:1.1rem;
  font-weight:700;
  color:#111 !important;
  margin-top:2em;
  margin-bottom:0.8em;
}
  .hero-subtitle {
  display: inline-block;
  border: 1px solid #111;
  padding: 6px 10px;
  margin: 10px 0 18px 0;
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  color: #333;
  background: #f7f7f7;
  text-transform: uppercase;
}

  /* ===== Table of Contents ===== */
  .toc-box {
    border: 1px solid var(--border);
    background: #fafafa;
    padding: 22px 26px;
    margin-bottom: 40px;
  }

  .toc-title {
    font-family: "Courier New", monospace;
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #444;
    margin-bottom: 12px;
  }

  .toc-box ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .toc-box li {
    margin: 7px 0;
  }

  .toc-box a {
    color: #333;
    text-decoration: none;
    font-size: 0.92rem;
    line-height: 1.5;
  }

  .toc-box a:hover {
    color: #111;
    text-decoration: underline;
  }

  .toc-h3 {
    margin-left: 20px;
  }

  .toc-h3 a {
    font-size: 0.85rem;
    color: #555;
  }

  /* ===== Tag pills ===== */
  .tag-list {
    margin: 14px 0 0;
  }

  .tag-pill {
    display: inline-block;
    border: 1px solid #111;
    padding: 3px 9px;
    margin: 3px 6px 3px 0;
    font-family: "Courier New", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #333;
    background: #f7f7f7;
    text-decoration: none;
    transition: all 0.15s ease;
  }

  .tag-pill:hover {
    background: #111;
    color: #fff;
  }

  .category-pill {
    display: inline-block;
    border: 1px solid #111;
    padding: 2px 8px;
    margin-right: 6px;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #333;
    text-decoration: none;
  }

  .category-pill:hover {
    background: #111;
    color: #fff;
  }

  /* ===== Word count / reading time chip ===== */
  .meta-extra {
    color: var(--muted);
  }

  /* ===== Tags / Categories archive pages ===== */
  .tag-cloud {
    margin: 24px 0 40px;
    padding-bottom: 30px;
    border-bottom: 1px solid #ddd;
  }

  .archive-group {
    margin-bottom: 44px;
  }

  .archive-group-title {
    font-size: 1.1rem;
    font-weight: 800;
    border-bottom: 1px solid #111;
    padding-bottom: 8px;
    margin-bottom: 14px;
  }

  .archive-count {
    font-weight: 400;
    color: var(--muted);
    font-size: 0.82rem;
  }

  .archive-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .archive-list li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 9px 0;
    border-bottom: 1px dashed #ddd;
  }

  .archive-list a {
    color: #111;
    text-decoration: none;
    font-size: 0.95rem;
  }

  .archive-list a:hover {
    text-decoration: underline;
  }

  .archive-date {
    font-family: "Courier New", monospace;
    font-size: 0.72rem;
    color: var(--muted);
    white-space: nowrap;
  }
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <a href="{{ '/' | relative_url }}">
        <span>Lianru's</span>Blog
      </a>
    </div>

    <nav class="nav-menu">
      <a href="{{ '/' | relative_url }}">Index</a>
      <a href="{{ '/tags/' | relative_url }}">Tags</a>
      <a href="{{ '/categories/' | relative_url }}">Categories</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer>
    <div>
      <span style="font-family:'Courier New', monospace; font-weight:bold; margin-right:10px;">CONTACT:</span>
      <a href="mailto:lianruliu2001@gmail.com" class="footer-link">lianruliu2001@gmail.com</a>
    </div>

    <div class="copyright">
      &copy; {{ site.time | date: "%Y" }} Lianru Liu. All Rights Reserved.
    </div>
  </footer>

  <script>
    function filterPosts() {
      const input = document.getElementById('search-input');
      if (!input) return;

      const query = input.value.toLowerCase();
      const posts = document.querySelectorAll('.post-card');
      const noResults = document.getElementById('no-results');
      let count = 0;

      posts.forEach(post => {
        const text = post.innerText.toLowerCase();

        if (text.includes(query)) {
          post.style.display = 'block';
          count++;
        } else {
          post.style.display = 'none';
        }
      });

      if (noResults) {
        noResults.style.display = count === 0 ? 'block' : 'none';
      }
    }

    function buildTOC() {
      const tocList = document.getElementById('toc-list');
      const tocBox = document.getElementById('toc');
      const content = document.querySelector('.article-content');
      if (!tocList || !tocBox || !content) return;

      const headings = content.querySelectorAll('h2, h3');

      if (headings.length < 2) {
        tocBox.style.display = 'none';
        return;
      }

      let usedIds = {};

      headings.forEach(function (heading, i) {
        if (!heading.id) {
          let slug = heading.textContent
            .toLowerCase()
            .trim()
            .replace(/[^\w\u4e00-\u9fa5\s-]/g, '')
            .replace(/\s+/g, '-');
          if (!slug) slug = 'section-' + i;
          if (usedIds[slug] !== undefined) {
            usedIds[slug] += 1;
            slug = slug + '-' + usedIds[slug];
          } else {
            usedIds[slug] = 0;
          }
          heading.id = slug;
        }

        const li = document.createElement('li');
        if (heading.tagName === 'H3') li.className = 'toc-h3';

        const a = document.createElement('a');
        a.href = '#' + heading.id;
        a.textContent = heading.textContent;

        li.appendChild(a);
        tocList.appendChild(li);
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      buildTOC();

      const cards = document.querySelectorAll('.post-card');

      cards.forEach(card => {
        const link = card.querySelector('.post-title a');

        if (link) {
          card.addEventListener('click', function () {
            window.location.href = link.href;
          });
        }
      });
    });
  </script>
</body>
</html>
