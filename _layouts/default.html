<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>

  <style>
    :root {
      --bg-color: #f0f0f0;
      --card-bg: #ffffff;
      --border-thick: 3px solid #000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: #111;
      font-family: 'Helvetica Neue', sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #000;
      color: #fff;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 5px solid #333;
    }

    .logo {
      font-family: 'Courier New', monospace;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .logo span {
      background: #fff;
      color: #000;
      padding: 0 5px;
      margin-right: 5px;
    }

    .nav-menu a {
      color: #ccc;
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      flex: 1;
      width: 100%;
    }

    .intro-box {
      border: var(--border-thick);
      padding: 30px;
      margin-bottom: 25px;
      background: var(--card-bg);
      box-shadow: 8px 8px 0px rgba(0,0,0,0.1);
    }

    .intro-quote {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      color: #666;
      border-left: 4px solid #000;
      padding-left: 15px;
    }

    .search-wrapper {
      margin: 20px 0 25px 0;
    }

    .search-input {
      width: 100%;
      padding: 15px;
      font-size: 1rem;
      border: 2px solid #000;
      background: #fff;
      font-family: 'Courier New', monospace;
      outline: none;
    }

    .search-input:focus {
      box-shadow: 5px 5px 0px #000;
    }

    .post-card {
      background: var(--card-bg);
      border: 1px solid #000;
      margin-bottom: 20px;
      padding: 25px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .post-card:hover {
      transform: translateY(-3px);
      box-shadow: 6px 6px 0px #000;
    }

    .post-meta {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .post-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .post-title a {
      color: #111;
      text-decoration: none;
    }

    .post-title a:hover {
      text-decoration: underline;
    }

    .article {
      background: var(--card-bg);
      border: var(--border-thick);
      padding: 50px;
      box-shadow: 10px 10px 0px rgba(0,0,0,0.1);
    }

    .article h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 10px;
      border-bottom: 4px solid #000;
      padding-bottom: 20px;
    }

    .article-content {
      font-size: 1.15rem;
      margin-top: 30px;
      font-family: Georgia, serif;
    }

    .article-content p {
      margin-bottom: 1.2em;
    }

    .back-link {
      display: inline-block;
      background: #000;
      color: #fff;
      padding: 5px 15px;
      font-family: 'Courier New', monospace;
      text-decoration: none;
      font-size: 0.8rem;
      margin-bottom: 30px;
    }

    footer {
      background-color: #0e0e0e;
      color: #888;
      padding: 40px 20px;
      text-align: center;
      border-top: 5px solid #333;
      margin-top: 60px;
    }

    .footer-link {
      color: #fff;
      text-decoration: none;
      border-bottom: 1px dotted #666;
    }

    .copyright {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      margin-top: 20px;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <a href="{{ '/' | relative_url }}" style="color:white; text-decoration:none;">
        <span>LIANRU</span>ARCHIVE
      </a>
    </div>

    <nav class="nav-menu">
      <a href="{{ '/' | relative_url }}">Index</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer>
    <div style="margin-bottom: 15px;">
      <span style="font-family: 'Courier New', monospace; font-weight: bold; margin-right: 10px;">CONTACT:</span>
      <a href="mailto:lianruliu2001@gmail.com" class="footer-link">lianruliu2001@gmail.com</a>
    </div>

    <div class="copyright">
      &copy; {{ site.time | date: "%Y" }} Lianru Liu. All Rights Reserved.
    </div>
  </footer>

  <script>
    function filterPosts() {
      const input = document.getElementById('search-input');
      if (!input) return;

      const query = input.value.toLowerCase();
      const posts = document.querySelectorAll('.post-card');
      const noResults = document.getElementById('no-results');
      let count = 0;

      posts.forEach(post => {
        const text = post.innerText.toLowerCase();

        if (text.includes(query)) {
          post.style.display = 'block';
          count++;
        } else {
          post.style.display = 'none';
        }
      });

      if (noResults) {
        noResults.style.display = count === 0 ? 'block' : 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      const cards = document.querySelectorAll('.post-card');

      cards.forEach(card => {
        const link = card.querySelector('a');

        if (link) {
          card.addEventListener('click', function () {
            window.location.href = link.href;
          });
        }
      });
    });
  </script>
</body>
</html>
