---
layout: default
---

<article class="article">
  <a href="{{ '/' | relative_url }}" class="back-link">[ < BACK ]</a>

  <h1>{{ page.title }}</h1>

  <div class="post-meta">
    {{ page.date | date: "%Y.%m.%d" }}
    {% if page.categories %}
      · {{ page.categories | join: " / " }}
    {% endif %}
  </div>

  <div class="article-content">
    {{ content }}
  </div>
</article>
