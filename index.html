<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="Lianru's Archive - A digital collection of thoughts on Economics, Philosophy, and Wealth.">
    <meta name="keywords" content="Lianru, Blog, Economics, Philosophy, Soros, Billionaire, 经济学, 哲学">
    <meta name="author" content="Lianru Liu">
    
    <title>LIANRU ARCHIVE</title>
    
    <style>
        /* ==================== 样式区 (CSS) ==================== */
        :root { --bg-color: #f0f0f0; --card-bg: #ffffff; --border-thick: 3px solid #000; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg-color); 
            color: #111; 
            font-family: 'Helvetica Neue', sans-serif; 
            line-height: 1.6; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 顶部导航 */
        header { background-color: #000; color: #fff; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 5px solid #333; }
        .logo { font-family: 'Courier New', monospace; font-size: 1.5rem; font-weight: bold; cursor: pointer; }
        .logo span { background: #fff; color: #000; padding: 0 5px; margin-right: 5px; }
        .nav-menu a { color: #ccc; text-decoration: none; margin-left: 20px; font-size: 0.9rem; font-weight: bold; text-transform: uppercase; }

        /* 主容器 */
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; flex: 1; width: 100%; }

        /* 搜索框 */
        .search-wrapper { margin-bottom: 30px; position: relative; }
        .search-input { width: 100%; padding: 15px; font-size: 1rem; border: 2px solid #000; background: #fff; font-family: 'Courier New', monospace; outline: none; }
        .search-input:focus { background: #ffffcc; }

        /* 内容样式 */
        .intro-box { border: var(--border-thick); padding: 30px; margin-bottom: 40px; background: var(--card-bg); box-shadow: 8px 8px 0px rgba(0,0,0,0.1); }
        .intro-quote { font-family: 'Courier New', monospace; font-size: 0.9rem; color: #666; border-left: 4px solid #000; padding-left: 15px; }
        
        .post-card { background: var(--card-bg); border: 1px solid #000; margin-bottom: 20px; padding: 25px; transition: all 0.2s ease; cursor: pointer; }
        .post-card:hover { transform: translateY(-3px); box-shadow: 6px 6px 0px #000; border-color: #000; }
        .post-meta { font-family: 'Courier New', monospace; font-size: 0.8rem; color: #666; margin-bottom: 10px; text-transform: uppercase; }
        .post-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 5px; }

        /* 文章详情 */
        #article-view { display: none; background: var(--card-bg); border: var(--border-thick); padding: 50px; box-shadow: 10px 10px 0px rgba(0,0,0,0.1); }
        .back-btn { display: inline-block; background: #000; color: #fff; padding: 5px 15px; font-family: 'Courier New', monospace; cursor: pointer; font-size: 0.8rem; margin-bottom: 30px; }
        .full-article-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; border-bottom: 4px solid #000; padding-bottom: 20px; }
        .full-article-content { font-size: 1.15rem; margin-top: 30px; font-family: 'Georgia', serif; }
        .full-article-content p { margin-bottom: 25px; }

        /* 🟢 NEW: 底部页脚 (Footer) */
        footer {
            background-color: #0e0e0e;
            color: #888;
            padding: 40px 20px;
            text-align: center;
            border-top: 5px solid #333;
            margin-top: 60px;
        }
        .footer-link { color: #fff; text-decoration: none; border-bottom: 1px dotted #666; transition: all 0.3s; }
        .footer-link:hover { color: #ffffcc; border-bottom: 1px solid #ffffcc; }
        .copyright { font-family: 'Courier New', monospace; font-size: 0.8rem; margin-top: 20px; opacity: 0.6; }

    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="showHome()"><span>LIANRU</span>ARCHIVE</div>
        <nav class="nav-menu">
            <a href="#" onclick="showHome()">Index</a>
            <a href="#">About</a>
        </nav>
    </header>

    <div class="container">
        <div id="list-view">
            <div class="intro-box">
                <h2>WELCOME.</h2><br>
                <div class="intro-quote">
                    "The safest way to get what you want is to try and deserve what you want." — Charlie Munger
                </div>
            </div>

            <div class="search-wrapper">
                <input type="text" id="search-input" class="search-input" placeholder="Type to search... (输入关键词搜索)" onkeyup="filterPosts()">
            </div>

            <div id="posts-container"></div>
            <div id="no-results" style="display:none; text-align:center; color:#666;">No articles found.</div>
        </div>

        <div id="article-view">
            <div class="back-btn" onclick="showHome()">[ < BACK ]</div>
            <h1 class="full-article-title" id="view-title"></h1>
            <div class="post-meta" id="view-date"></div>
            <div class="full-article-content" id="view-body"></div>
        </div>
    </div>

    <footer>
        <div style="margin-bottom: 15px;">
            <span style="font-family: 'Courier New', monospace; font-weight: bold; margin-right: 10px;">CONTACT:</span>
            <a href="mailto:lianruliu2001@gmail.com" class="footer-link">lianruliu2001@gmail.com</a>
        </div>
        <div class="copyright">
            &copy; 2025 Lianru Liu. All Rights Reserved.
        </div>
    </footer>

    <script>
        // ==========================================
        // 🔴 数据中心 (DATA CENTER)
        // ==========================================
        const blogPosts = [
            {
                id: 1, 
                title: "Find the passion(找到激情所在)", 
                date: "2025-11-20 | PHILOSOPHY", 
                content: `<p>Humans are narrative creatures.</p><p>人类是叙事动物。</p>`
            },
            {
                id: 2,
                title: "Make dream come true(去实现梦想)",
                date: "2025-09-22 | LIFE",
                content: `<p>Dream is not an emotion; it is a state of being.</p>
                    <p>梦想不是一种情绪，而是一种存在状态。</p>
                    <p><strong>重点：</strong> 追求梦想要立刻行动。</p>`
            },
            {
                id: 3,
                title: "The Billionaire Algorithm (亿万富翁算法)",
                date: "2025-01-01 | WEALTH",
                content: `<p>Compound interest is the 8th wonder of the world.</p>
                    <p>复利是世界第八大奇迹。</p>`
            },
	{
   	 id: 4, 
    	title: "Untitled（第一次亲密接触）", 
    	date: "2026-04-19 | LIFE", 
    	content: `<p>如果我有一千万，我就就能买一套房子。</p>
		<p>我有一千万吗？ 没有。所以我仍然没有一套房子。<p>
		<p>如果我有翅膀，我就能飞。<p>
		<p>我有翅膀吗？没有。所以我没有办法飞。<p>
		<p>如果把整个太平洋的水倒出，也浇不熄我对你爱情的火。<p>
		<p>整个太平洋的水全部倒的出来吗？不行。 所以我并不爱你。<p>`
      }

        ];

        // 逻辑引擎
        const container = document.getElementById('posts-container');

        function renderList(posts) {
            container.innerHTML = '';
            if (posts.length === 0) {
                document.getElementById('no-results').style.display = 'block';
                return;
            }
            document.getElementById('no-results').style.display = 'none';
            
            posts.forEach(post => {
                const div = document.createElement('div');
                div.className = 'post-card';
                div.onclick = () => openArticle(post.id);
                div.innerHTML = `
                    <div class="post-meta">${post.date}</div>
                    <div class="post-title">${post.title}</div>
                    <div style="font-size:0.9rem; color:#666;">Click to read ></div>
                `;
                container.appendChild(div);
            });
        }

        function filterPosts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = blogPosts.filter(post => {
                return post.title.toLowerCase().includes(query) || post.date.toLowerCase().includes(query);
            });
            renderList(filtered);
        }

        function openArticle(id) {
            const post = blogPosts.find(p => p.id === id);
            document.getElementById('view-title').innerText = post.title;
            document.getElementById('view-date').innerText = post.date;
            document.getElementById('view-body').innerHTML = post.content;
            window.scrollTo(0, 0);
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('article-view').style.display = 'block';
        }

        function showHome() {
            document.getElementById('article-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            document.getElementById('search-input').value = ''; 
            renderList(blogPosts); 
            window.scrollTo(0, 0);
        }

        renderList(blogPosts);
    </script>
</body>
</html>
